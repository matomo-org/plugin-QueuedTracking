# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --plugin="QueuedTracking" --php-versions="matomo5_min_php,matomo5_max_php" --enable-redis --schedule-cron="0 2 * * 6"

name: Plugin QueuedTracking Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:
    inputs:
      block:
        description: 'Block mirror.gcr.io: none, full, or first (unblocked after 5 s)'
        type: choice
        options: [none, full, first]
        default: none
      cache:
        type: boolean
        default: true
      break-save:
        type: boolean
        default: false
  schedule:
  - cron: "0 2 * * 6"

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none


jobs:
  PluginTests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ 'matomo5_min_php', 'matomo5_max_php' ]
        target: ['minimum_required_matomo', 'maximum_supported_matomo']
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          persist-credentials: false
      - name: Install package ripgrep
        run: sudo apt-get install ripgrep
      - name: Service image test setup (throwaway)
        env:
          BLOCK: ${{ github.event_name == 'pull_request' && 'full' || inputs.block || 'none' }}
          BREAK_SAVE: ${{ inputs.break-save || false }}
        run: |
          echo "block=$BLOCK break-save=$BREAK_SAVE"
          case "$BLOCK" in
            full) echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts ;;
            first)
              echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
              nohup sh -c 'sleep 5; sudo sed -i "/mirror.gcr.io/d" /etc/hosts' >/dev/null 2>&1 &
              ;;
          esac
          # a file where the action wants a directory makes docker save fail
          if [ "$BREAK_SAVE" = true ]; then touch "$RUNNER_TEMP/matomo-service-images"; fi
      - name: Run tests
        uses: matomo-org/github-action-tests@id-309-redis-version-tag
        with:
          plugin-name: 'QueuedTracking'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          matomo-test-branch: ${{ matrix.target }}
          redis-service: true
          service-image-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: ${{ matrix.php == 'matomo5_min_php' && matrix.target == 'maximum_supported_matomo' }}
  UI:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          persist-credentials: false
      - name: Service image test setup (throwaway)
        env:
          BLOCK: ${{ github.event_name == 'pull_request' && 'full' || inputs.block || 'none' }}
          BREAK_SAVE: ${{ inputs.break-save || false }}
        run: |
          echo "block=$BLOCK break-save=$BREAK_SAVE"
          case "$BLOCK" in
            full) echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts ;;
            first)
              echo "0.0.0.0 mirror.gcr.io" | sudo tee -a /etc/hosts
              nohup sh -c 'sleep 5; sudo sed -i "/mirror.gcr.io/d" /etc/hosts' >/dev/null 2>&1 &
              ;;
          esac
          # a file where the action wants a directory makes docker save fail
          if [ "$BREAK_SAVE" = true ]; then touch "$RUNNER_TEMP/matomo-service-images"; fi
      - name: running tests
        uses: matomo-org/github-action-tests@id-309-redis-version-tag
        with:
          plugin-name: 'QueuedTracking'
          matomo-test-branch: 'maximum_supported_matomo'
          test-type: 'UI'
          php-version: 'matomo5_min_php'
          node-version: '16'
          redis-service: true
          service-image-cache: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: true
