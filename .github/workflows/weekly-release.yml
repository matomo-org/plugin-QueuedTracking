name: Weekly release
on:
  # Run by hand for now; the Monday schedule and the other-branches sweep come later.
  workflow_dispatch:
    inputs:
      skip-ci-check:
        description: "Release this branch even though its CI failed or is still running"
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-dev-release.yml@main
    with:
      skip-ci-check: ${{ inputs.skip-ci-check || false }}
    secrets:
      # A user other than github-actions, so the bot's date PR can be approved and merged.
      approver-token: ${{ secrets.TESTS_ACCESS_TOKEN }}
